<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tyree – Music &amp; Links</title>
    <meta
      name="description"
      content="Listen to Tyree on Apple Music, Spotify and YouTube, and follow along on X."
    />
    <meta name="theme-color" content="#0e0c0b" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://dartsac.github.io/biolink/" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Tyree – Music & Links" />
    <meta
      property="og:description"
      content="Listen to Tyree on Apple Music, Spotify and YouTube."
    />
    <meta property="og:url" content="https://dartsac.github.io/biolink/" />
    <meta
      property="og:image"
      content="https://dartsac.github.io/biolink/artist/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@reidotyree" />

    <link rel="preload" as="image" href="artist/profile.webp" type="image/webp" />
    <link href="css/normalize.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <video
      class="background-video"
      autoplay
      muted
      loop
      playsinline
      disableremoteplayback
      preload="auto"
      poster="artist/background-poster.jpg"
      aria-hidden="true"
    >
      <!-- MP4 first: Safari must never pick the WebM (it stalls in WebKit). -->
      <source src="artist/background.mp4" type="video/mp4" />
      <source src="artist/background.webm" type="video/webm" />
    </video>

    <main>
      <header>
        <h1 class="signature">
          <img src="artist/tyree-signature.svg" alt="Tyree" />
        </h1>
        <picture>
          <source srcset="artist/profile.webp" type="image/webp" />
          <img
            class="profile-pic"
            src="artist/profile.jpg"
            alt="Tyree holding a guitar controller"
            width="480"
            height="480"
          />
        </picture>
        <p class="handle">@tyree730</p>

        <div class="player" hidden>
          <button
            type="button"
            class="toggle-sound sound-mute"
            aria-label="Play music"
          >
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
            </svg>
          </button>
          <span class="player__text">
            <span class="player__label">Preview</span>
            <span class="player__title" aria-live="polite">
              <span class="player__title-track">
                <span class="player__title-text"></span>
              </span>
            </span>
          </span>
          <button type="button" class="player__next" aria-label="Next song">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5.5v13l9.5-6.5zM16 5h3v14h-3z" />
            </svg>
          </button>
        </div>
      </header>

      <audio id="audio" preload="metadata"></audio>

      <nav aria-label="Links">
        <ul class="links">
          <li>
            <a href="https://music.apple.com/us/artist/tyree/1028194367">
              <img src="icons/standard.svg" alt="" width="20" height="20" />
              Apple Music
            </a>
          </li>
          <li>
            <a href="https://open.spotify.com/artist/4J99V6XxSI2ElQozXzeOAL">
              <img src="icons/spotify.svg" alt="" width="20" height="20" />
              Spotify
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/@tyree1843">
              <img src="icons/youtube.svg" alt="" width="20" height="20" />
              YouTube
            </a>
          </li>
          <li>
            <a href="https://x.com/reidotyree">
              <img src="icons/x.svg" alt="" width="20" height="20" />
              X
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
